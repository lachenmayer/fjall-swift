name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

  bindings-fresh:
    name: Generated bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Regenerate bindings
        run: ./scripts/generate-bindings.sh
      - name: Diff
        run: git diff --exit-code Sources/FjallFFI Sources/CFjallFFI

  swift-linux:
    name: Swift tests (Linux)
    runs-on: ubuntu-latest
    # Linux support is best-effort for now; don't block CI on it.
    continue-on-error: true
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
      - name: Build Rust static library
        run: |
          cargo build --manifest-path rust/Cargo.toml --release
          # The crate also builds a cdylib; remove it so the linker picks the
          # static library and the test binary needs no LD_LIBRARY_PATH.
          rm -f rust/target/release/libfjall_ffi.so
      - name: Swift tests
        run: swift test -Xlinker -L"$PWD/rust/target/release"

  swift-macos:
    name: Swift tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build XCFramework (native slice only)
        run: ./scripts/build-xcframework.sh --native
      - name: Swift tests
        run: FJALL_USE_LOCAL_FRAMEWORK=1 swift test
